name: isp_field
description: Aplicativo offline-first para técnicos de provedores.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  connectivity_plus: ^6.0.5
  uuid: ^4.5.0
  camera: 0.12.0+2
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.1
  signature: ^5.5.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
