# Configuração do Nginx para eco-auth.com — proxy reverso na frente do
# backend (que roda em 127.0.0.1:8000, seja direto ou via docker-compose
# com a porta 8000 publicada no host).
#
# COMO USAR (na VPS, depois que o DNS de eco-auth.com já estiver apontado
# para o IP do servidor):
#
# 1. Instale o Nginx e o Certbot:
#      sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#
# 2. Copie este arquivo para /etc/nginx/sites-available/eco-auth.conf
#    e crie o link simbólico:
#      sudo ln -s /etc/nginx/sites-available/eco-auth.conf /etc/nginx/sites-enabled/
#
# 3. Comente TEMPORARIAMENTE o bloco "server" de HTTPS lá embaixo (o
#    certificado ainda não existe) e teste/recarregue só com o bloco HTTP:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. Peça o certificado (o Certbot detecta este arquivo e configura o
#    HTTPS sozinho, ativando o bloco que você tinha comentado):
#      sudo certbot --nginx -d eco-auth.com -d www.eco-auth.com
#
# 5. Teste a renovação automática (o Certbot já agenda isso sozinho, mas
#    vale confirmar que funciona antes de precisar de verdade):
#      sudo certbot renew --dry-run

# Redireciona todo tráfego HTTP para HTTPS, exceto o desafio do Certbot
# (necessário para a emissão/renovação do certificado).
server {
    listen 80;
    listen [::]:80;
    server_name eco-auth.com www.eco-auth.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eco-auth.com www.eco-auth.com;

    # O Certbot preenche estas duas linhas automaticamente no passo 4 acima.
    # ssl_certificate     /etc/letsencrypt/live/eco-auth.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eco-auth.com/privkey.pem;

    # Evidências (fotos de instalação) podem chegar a alguns MB — o limite
    # real de 15 MB é aplicado pelo próprio backend; aqui só evitamos que
    # o Nginx rejeite antes de chegar lá (padrão dele é 1 MB).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads de foto em sinal fraco de campo podem demorar — evita
        # que o Nginx desista antes do backend terminar de processar.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
